name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and local/mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run build and tests
        run: npm test
        env:
          CI: true
      # These tests use the local server and Supabase mocks. They are not staging RLS evidence.
