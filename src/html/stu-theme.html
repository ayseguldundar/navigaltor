<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* ===== Öğrenci & veli teması: çok açık krem zemin, beyaz kartlar, 12/20/28 yarıçap ===== */
body[data-role=s],body[data-role=p]{--krem-50:#FBF5EC;--glass:#FFFFFF;--glass-2:#FFFFFF;--glass-brd:rgba(226,214,196,.85);--r-card:20px;--r-panel:20px;--r-ctl:12px;--serif:"Fraunces","Source Serif 4",Georgia,serif;--sans:"Nunito","Manrope",Arial,sans-serif;--shadow:0 10px 30px -10px rgba(60,30,10,.10);--shadow-h:0 20px 40px -15px rgba(129,0,0,.18);background:#FBF5EC}

body[data-role=s] .amb,body[data-role=p] .amb{background:radial-gradient(800px 500px at 90% -10%,#F8EEDF,transparent 60%),#FBF5EC}
body[data-role=s] .card,body[data-role=p] .card{background:#fff}
:root[data-text=Küçük]{font-size:13px}:root[data-text=Büyük] body{font-size:16px}
:root[data-text=Büyük] .qstem{font-size:22px}
body.reduce *,body.reduce *::before,body.reduce *::after{animation-duration:1ms!important;transition-duration:1ms!important}
.btn{border-radius:12px}.btn:active{transform:scale(.97)}
.btn.lg{height:48px;padding:0 20px;font-size:15px;border-radius:14px}
.btn.light{background:#fff;color:#810000}
.o-h{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;margin:0 0 4px;font-size:20px;text-wrap:balance}
.sec-h{font-size:26px;margin:8px 0 0}
.ocard{background:#fff;border:1px solid var(--glass-brd);border-radius:20px;box-shadow:var(--shadow);padding:20px;min-width:0;transition:box-shadow 200ms var(--ease),transform 200ms var(--ease)}
.split2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.hero-b{position:relative;display:flex;align-items:center;gap:24px;padding:22px 28px;border-radius:28px;background:linear-gradient(120deg,#FFF 0%,#FBEFDF 55%,#F3DDBC 100%);border:1px solid var(--glass-brd);box-shadow:var(--shadow);overflow:hidden}
.hero-b::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(129,0,0,.10),transparent 70%)}
.hero-b.par{background:linear-gradient(120deg,#fff,#F8EEDF)}
.hb-txt{position:relative;z-index:1;min-width:0}
.navi-fig{display:inline-block;height:var(--nh);flex:none;border-radius:24px;overflow:hidden;background:#F7EFE2;box-shadow:inset 0 0 0 1px rgba(226,214,196,.7)}
.navi-fig img{height:100%;width:auto;display:block}
.navi-fr{display:inline-grid;place-items:center;width:var(--nz);height:var(--nz);flex:none;border-radius:50%;overflow:hidden;background:#F7EFE2;box-shadow:0 0 0 2px #fff,0 4px 12px -4px rgba(60,30,10,.3)}
.navi-fr img{width:100%;height:100%;object-fit:cover;object-position:50% 0%}
.navi-fr.mini{box-shadow:none}
.hb-navi{animation:wave 1.2s var(--ease) 1}
@keyframes wave{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
.bubble{position:relative;background:#FBF3E7;border:1px solid #EFDFC5;border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.5;animation:popin 220ms var(--ease)}
.bubble.b-right{background:#EAF7EF;border-color:#BFE6CD}.bubble.b-wrong{background:#FFF7EC;border-color:#F2D9B4}.bubble.b-hint{background:#FFF4D9;border-color:#F3D98F}
.kcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:1px solid var(--glass-brd);border-radius:20px;padding:18px;box-shadow:var(--shadow);transition:transform 200ms var(--ease),box-shadow 200ms var(--ease)}
button.kcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.kcard .kl{font-weight:800;font-size:13px;color:var(--ink2);margin-top:8px}
.kcard .kn{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.05}
.kcard .kn small{font-size:15px;font-family:var(--sans);color:var(--ink3)}
.kcard .ks{font-size:12px;color:var(--ink3)}
.picon{display:inline-grid;place-items:center;border-radius:18px;background:var(--pbg);padding:10px;box-shadow:0 8px 18px -10px rgba(0,0,0,.25)}
.picon svg{width:100%;height:100%}
.cic{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;flex:none}
.trow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid #F0E6D8;background:#FFFCF8;transition:background 160ms,transform 160ms}
.trow:hover{background:#FFF7EE}
.trow.unr{border-color:#E9C9A2;background:#FFF8EF}
.spill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.sp-wait{background:#FCEFD6;color:#8A5A12}.sp-go{background:#FDE4DE;color:#810000}.sp-sent{background:#E2EBFC;color:#244BA8}.sp-eval{background:#EFE6FD;color:#5B30C2}.sp-done{background:#DDF5E8;color:#1E7A50}.sp-teach{background:#F9E3DF;color:#810000}.sp-sys{background:#EFE9E1;color:#5a4a37}.sp-school{background:#111;color:#E8C999}.sp-fire{background:#FFEBD2;color:#B4561A}
.cprog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:6px;border-radius:14px;transition:background 160ms}
.cprog:hover{background:#FFF7EE}
.cprog .cn{width:120px;font-weight:700}
.pbar{display:block;flex:1;height:10px;border-radius:999px;background:#F1E8DB;overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--c,#810000),color-mix(in srgb,var(--c,#810000) 55%,#F5B04A));box-shadow:0 0 10px -2px color-mix(in srgb,var(--c,#810000) 60%,transparent);animation:grow 400ms var(--ease) backwards;transform-origin:left}
.pbar.xp{height:8px}
.navi-card{background:linear-gradient(135deg,#fff,#FFF6EA)}
.tpill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid var(--glass-brd);font-size:13px;white-space:nowrap}
.sfbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 16px;border-radius:20px;background:#fff;border:1px solid var(--glass-brd);box-shadow:var(--shadow)}
.sfl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--ink2);min-width:0}
.sfl .sel{min-height:38px;border-radius:12px;background:#FFFCF8}
.sfbar .res{margin-left:auto;font-weight:800;font-size:13px;align-self:center}
.chipb{height:auto;min-height:32px;padding:6px 12px;cursor:pointer;transition:background 150ms,transform 150ms}
.chipb:hover{background:#F9E3DF}
.chipb:active{transform:scale(.97)}
/* demo */
#demo{position:fixed;z-index:70;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.demo{background:rgba(255,255,255,.96);border:1px solid var(--glass-brd);border-radius:20px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);padding:8px;max-width:min(420px,calc(100vw - 32px));font-family:var(--sans)}
.demo-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.demo-lbl{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12px;color:#810000;padding-left:6px}
.demo-pop{padding:10px 6px 4px;max-height:60vh;overflow:auto}
.demo-steps{margin:6px 0 0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:4px}
/* beceri kartları */
.skc{background:#fff;border:1.5px solid var(--glass-brd);border-radius:20px;padding:16px;box-shadow:var(--shadow);transition:border-color 200ms,box-shadow 200ms}
.skc.open{border-color:var(--sk);box-shadow:0 0 0 3px color-mix(in srgb,var(--sk) 15%,transparent)}
.skc-hd{display:flex;align-items:center;gap:12px;width:100%}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring .ri{position:absolute;inset:0;display:grid;place-items:center;color:var(--sk)}
.tagp{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;background:color-mix(in srgb,var(--sk) 14%,#fff);color:var(--sk)}
.lvl{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.lvl b{font-family:var(--serif);font-size:30px;color:var(--sk)}

.xpl{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--ink3);margin:12px 0 4px}
.ms{animation:popin 200ms var(--ease)}
.msr{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;color:var(--ink3)}
.msr.ok{color:#000;font-weight:700}
.mdot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#EEE6DA;color:#fff;flex:none}
.msr.ok .mdot{background:var(--sk)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:end;height:200px}
.wkd{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;border-radius:14px;padding:6px 0;transition:background 160ms}
.wkd:hover:not([disabled]),.wkd.on{background:#FFF4E6}
.wkd.fut{opacity:.45}
.wkm{font-size:12px;font-weight:800;color:var(--ink3)}

.wkn{font-weight:800;font-size:13px}
/* içerik */
.tree-s{padding:14px}
.tu{margin-bottom:12px}
.tk{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;margin-top:4px;transition:background 150ms}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-weight:800}

.frac span:last-child{padding:0 3px}

.bml{width:42px}

.stepc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#FFFCF8;border:1px solid #F0E6D8;animation:rise 260ms var(--ease) backwards}
/* soru ekranı */
.qhead{padding:14px 18px}
.qprog{display:flex;align-items:center;gap:6px}
.qd{width:22px;height:8px;border-radius:999px;background:#EEE6DA}
.qd.ok{background:#2E9E6B}.qd.no{background:#E0A04B}.qd.cur{background:#810000;width:34px}.qd.diag{outline:2px dashed #810000;outline-offset:1px}.qd.ex{background:#C9BBEA}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

.qstem{font-size:20px;font-weight:800;line-height:1.5;margin:8px 0 18px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.opt:hover:not([disabled]){border-color:#D9B98F;transform:translateY(-1px)}
.opt.sel{border-color:#810000;background:#FFF5F2}
.opt.ok{border-color:#2E9E6B;background:#EAF7EF;color:#14543A}
.opt.no{border-color:#E0A04B;background:#FFF6E8}
.opt .ol{width:30px;height:30px;border-radius:10px;font-size:13px}
.opt.sel .ol{background:#810000;color:#fff}.opt.ok .ol{background:#2E9E6B;color:#fff}
.in.big{font-size:20px;min-height:52px;font-weight:800}
.qbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.res{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;border-radius:12px;font-weight:800;animation:popin 200ms var(--ease)}
.res.ok{background:#EAF7EF;color:#14543A}.res.no{background:#FFF6E8;color:#7A4A0E}
.sol-steps{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.navi-side{display:flex;flex-direction:column;gap:12px;align-items:stretch;position:sticky;top:96px}
.navi-side .navi-fig{align-self:center;animation:popin 260ms var(--ease)}
.hintc{padding:8px 10px;border-radius:12px;background:#FFF8E4;font-size:13px}
.pchat{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.amsg{display:flex;gap:8px;align-items:flex-start}
.amsg .msg{max-width:100%}
.done-s{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.mstat{background:#FFFCF8;border:1px solid #F0E6D8;border-radius:16px;padding:12px}
.mstat span{display:block;font-size:12px;color:var(--ink3);font-weight:700}.mstat b{font-family:var(--serif);font-size:24px}
.celebrate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.bdg-big{width:84px;height:84px;margin-top:-40px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));animation:pop 500ms var(--ease)}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg)}70%{transform:scale(1.12)}100%{transform:none}}
/* stüdyo — dosya tarayıcısı */
.fx{background:#fff;border:1px solid var(--glass-brd);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.fx-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #F0E6D8}
.fx-tabs{display:flex;gap:4px}
.fx-tabs button{height:34px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13px;color:var(--ink3);transition:background 150ms,color 150ms}
.fx-tabs button:hover{background:#F6EFE6;color:#000}.fx-tabs button.on{background:#F3EAE0;color:#000}
.fx-search{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:10px;background:#F6F1EA;color:var(--ink3)}
.fx-search input{border:0;background:transparent;outline:none;width:160px;font-size:13px}
.fx-sel{width:auto;min-height:34px;height:34px;font-size:13px;padding:0 8px}
.fx-view{display:flex;border:1px solid #EAE0D2;border-radius:10px;overflow:hidden}
.fx-view button{width:34px;height:32px;display:grid;place-items:center;color:var(--ink3)}.fx-view button.on{background:#F3EAE0;color:#000}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding:18px}
.fx-list{display:flex;flex-direction:column;padding:8px}
.fx-list .fxc{flex-direction:row;align-items:center;border:0;border-bottom:1px solid #F0E6D8;border-radius:0}
.fx-list .fxt{width:96px;aspect-ratio:16/10;flex:none}
.fxc{display:flex;flex-direction:column;text-align:left;border-radius:14px;border:1px solid #EFE5D7;overflow:hidden;background:#fff;transition:box-shadow 180ms,transform 180ms,border-color 180ms;cursor:pointer}
.fxc:hover,.fxc:focus-visible{box-shadow:0 14px 30px -16px rgba(0,0,0,.3);transform:translateY(-2px);border-color:#E3CFB1}
.fxt{position:relative;aspect-ratio:16/10;background:#F6F1EA;display:grid;place-items:center;overflow:hidden}
.fxt>svg,.fxt>img{width:100%;height:100%;object-fit:cover;object-position:top}
.fxs{position:absolute;left:8px;top:8px}
.fico{color:#B9A68A}
.fxm{display:flex;flex-direction:column;gap:2px;padding:10px 12px;font-size:12px;color:var(--ink3);min-width:0}
.fxm b{color:#000;font-size:13.5px}
.fx-new .fxt{display:flex;flex-direction:column;gap:4px;color:#810000;background:repeating-linear-gradient(45deg,#FFF8F0 0 10px,#FFF3E6 10px 20px);border-bottom:0;height:100%;aspect-ratio:auto;min-height:190px;border:2px dashed #E3C9A5;border-radius:14px}
.fx-new{border:0}
.fx-new .fxt>svg{width:34px;height:34px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 16px;border:2px dashed #E3C9A5;border-radius:20px;background:#FFFBF5;color:#810000;cursor:pointer;text-align:center;transition:background 160ms,border-color 160ms}
.drop:hover,.drop.over{background:#FFF1E2;border-color:#810000}
.pv{background:#F6F1EA;border-radius:16px;padding:16px;display:grid;place-items:center}
.pv img{max-width:100%;border-radius:10px}
.avs{width:36px;height:36px;border-radius:12px;background:#810000;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
/* plan */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;min-width:1080px}
.wcol{background:#fff;border:1px solid var(--glass-brd);border-radius:18px;padding:10px;min-height:260px;transition:background 150ms,border-color 150ms}

.wch{display:flex;flex-direction:column;margin-bottom:8px}
.pchip{background:#FFFCF8;border:1px solid #F0E6D8;border-left:4px solid var(--cc);border-radius:12px;padding:8px;cursor:grab;transition:transform 150ms,box-shadow 150ms}
.pchip.fixed{cursor:default;background:#FBF7F1}.pchip.done{opacity:.6}.pchip.drag{opacity:.4}
.pchip:hover{box-shadow:0 8px 16px -10px rgba(0,0,0,.3)}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}
/* rozet */
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.bcard{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;background:#fff;border:1.5px solid #EAD9BF;box-shadow:var(--shadow);transition:transform 200ms,box-shadow 200ms}

.bcard.locked{background:#FBF8F3;border-style:dashed;border-color:#E6DDCF;box-shadow:none;color:var(--ink3)}
.bimg{width:64px;height:64px;flex:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18))}

@keyframes shine{50%{transform:scale(1.1) rotate(6deg)}}

.mbanner{display:flex;align-items:center;gap:24px;padding:28px 32px;border-radius:28px;background:linear-gradient(110deg,#5c0000 0%,#810000 35%,#C2502F 75%,#E8A35E 100%);color:#fff;overflow:hidden}

.mh{font-size:11px;font-weight:800;color:var(--ink3);text-align:center}

.asst{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.chatc{display:flex;flex-direction:column;gap:12px}
.ctxbar{border-bottom:1px solid #F0E6D8;padding-bottom:10px}
.sysm{align-self:center;font-size:12px;color:var(--ink3);background:#F6F1EA;padding:4px 10px;border-radius:999px}
.pvc{position:sticky;top:96px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.qcell{height:52px;border-radius:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid #EDE2D2;background:#fff;transition:transform 150ms}
.qcell:hover{transform:translateY(-2px)}
