<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NavigAItor Veli</title>
<meta name="theme-color" content="#810000">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest-veli.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="/app/ortak.css">
<link rel="stylesheet" href="/app/etkinlik.css">
<style>
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.kid{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.kid .av{width:56px;height:56px;border-radius:50%;background:#FFE7A8;overflow:hidden;display:grid;place-items:center;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}
.kpis .card b{font-size:28px;font-family:'Source Serif 4',Georgia,serif}
.list{display:grid;gap:8px}
.it{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.it b{display:block}.it small{color:var(--muted)}
.st{margin-left:auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st.yeni{background:#F6EEDF;color:var(--muted)}.st.devam{background:#FFF4D9;color:#7A5A12}.st.ok{background:var(--ok-bg);color:var(--ok)}
.note{padding:10px 12px;border-radius:12px;background:#FFFCF8;border:1px solid #F0E6D8;font-size:14px;margin-top:6px}
.home-tip{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:#FFF4D9;border:1px solid #F3D98F;font-size:14px}
</style>
<script src="/config.js"></script>
<script src="/app/kit-gorsel.js"></script>
</head>
<body>
<div class="wrap" style="max-width:960px">
  <div class="top"><a class="brand" href="/veli"><span class="logo">N</span><b>NavigAItor</b></a><span class="chip">Veli</span><div class="who" id="who"></div></div>
  <main id="app" aria-live="polite"><div class="card"><p class="muted">Yükleniyor…</p></div></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script type="module" src="/app/veli.js"></script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script>
</body>
</html>
