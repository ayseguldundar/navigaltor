<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NavigAItor Giriş</title>
<meta name="theme-color" content="#810000">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="/app/ortak.css">
<style>
.gw{width:min(560px,100%);margin:0 auto;padding:28px 16px 64px}
.gw header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.gw h1{font-size:30px;margin:8px 0 6px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.roles button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:16px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:800}
.roles button span{font-size:28px}.roles button.on{border-color:var(--brand);background:#FFF4F0;color:var(--brand)}
.toggle{background:none;border:none;color:var(--brand);font-weight:800;cursor:pointer;padding:6px 0}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff}
.radio input{margin-top:4px;accent-color:var(--brand)}
.kod{font-size:28px;text-align:center;letter-spacing:.3em;text-transform:uppercase;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;padding:14px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:52vh;overflow:auto;padding:2px}
.names button{padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:15px;cursor:pointer}
.names button:hover{border-color:var(--brand)}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--brand)}.pin-dots i.on{background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{padding:16px 0;font-size:24px;font-weight:800;border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.pad button:active{background:#FFF1EC}
.stu-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.consent{font-size:13px;line-height:1.55;max-height:180px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:#FFFCF8;margin-bottom:10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14px;margin-bottom:12px}.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--brand)}
.foot{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
</style>
<script src="/config.js"></script>
</head>
<body>
<div class="gw">
  <header><a class="brand" href="/"><span class="logo">N</span><b>NavigAItor</b></a><a class="small" href="/">Demoyu incele</a></header>
  <div id="app" class="card" aria-live="polite"><p class="muted">Yükleniyor…</p></div>
  <p class="foot">Sorun mu yaşıyorsunuz? Öğrenciler sınıf kodunu ve şifresini öğretmeninden alır.</p>
</div>
<script type="module" src="/app/giris.js"></script>
</body>
</html>
