<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NavigAItor Yönetim</title>
<meta name="theme-color" content="#810000">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest-ogretmen.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="/app/ortak.css">
<link rel="stylesheet" href="/app/etkinlik.css">
<style>
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.who .av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.who small{display:block;color:var(--muted);font-size:12px}
.hero{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.hero h1{font-size:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sec-card h3{font-size:22px}.sec-card .cc{font-size:22px;color:var(--brand)}
.sec-card .row{margin-top:8px}
.empty{text-align:center;padding:30px 12px}.empty .big{font-size:40px}
.pin-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pin-card{border:1.5px dashed #C9B79C;border-radius:14px;padding:12px;background:#fff;break-inside:avoid}
.pin-card b{font-size:16px}.pin-card .pin{font-size:26px;color:var(--brand)}
.pin-card .small{line-height:1.4}
.preview{max-height:260px;overflow:auto;margin-top:8px}
.tag-ok{color:var(--ok);font-weight:800}.tag-no{color:var(--muted)}
.inv{font-size:15px;color:var(--brand)}
@media print{body{background:#fff}.wrap>*:not(#printArea){display:none!important}#printArea{display:block!important}.pin-card{border-color:#999}}
#printArea{display:none}
.as-card{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.as-card h3{font-size:19px}.as-card:hover{border-color:#D8C8B0}
.bar{height:8px;border-radius:8px;background:#F0E6D8;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:8px}
.tag-mid{color:#9A6B00;font-weight:800}
.linkb{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}.linkb:hover b{text-decoration:underline;color:var(--brand)}
input.fb{min-width:160px;padding:7px 10px}
.ozet{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ozet>div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;background:#FFFCF8;border:1px solid #F0E6D8}.ozet span{font-size:12px;color:var(--muted)}.ozet b{font-size:13.5px}
@media (max-width:640px){.ozet{grid-template-columns:1fr}}
</style>
<script src="/config.js"></script>
<script src="/app/kit-gorsel.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/"><span class="logo">N</span><b>NavigAItor</b></a>
    <span class="chip" id="schoolName">…</span>
    <div class="who" id="who"></div>
  </div>
  <div id="app" aria-live="polite"><div class="card"><p class="muted">Yükleniyor…</p></div></div>
  <div id="printArea"></div>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script type="module" src="/app/yonetim.js"></script>
</body>
</html>
